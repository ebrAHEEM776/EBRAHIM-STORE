<!DOCTYPE html>
<!--
  category.html — [جديد] صفحة المنتجات: تعرض نوعاً واحداً فقط حسب الرابط
    category.html?cat=iphone      → إكسسوارات آيفون
    category.html                 → جميع المنتجات
    category.html?q=شاحن          → نتائج البحث
    category.html?brand=Anker     → منتجات علامة
    category.html?view=deals      → العروض  (new = وصل حديثاً، fav = المفضلة)
  المنطق في js/category.js
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A3622">
<!-- [كما كان] يطبّق الوضع الليلي/النهاري المحفوظ قبل رسم الصفحة لتجنب الوميض -->
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem("nova_theme"))}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>المنتجات | EBRAHIM STORE</title>
</head>
<body data-page="category">

<div id="shellTop"></div>

<div class="layout">
  <aside class="side" id="side"></aside>

  <main class="content" id="shop">
    <!-- مسار التنقل + عنوان الصفحة (يتغير حسب النوع) -->
    <nav class="crumbs" id="crumbs" aria-label="مسار التنقل"></nav>
    <div class="phead"><span class="pic" id="pIcon" aria-hidden="true">✨</span><div><h1 class="ltitle" id="listTitle">جميع المنتجات</h1><p class="count" id="count" aria-live="polite"></p></div></div>

    <!-- [كما كان] أدوات الفلترة: الموديل، الترتيب، أعلى سعر، المتوفر، الخصم، المتوافق مع هاتفي -->
    <div class="tools">
      <select id="model" aria-label="موديل الهاتف"><option value="">كل الموديلات</option></select>
      <select id="sort" aria-label="الترتيب">
        <option value="rec">مقترحات المتجر</option>
        <option value="new">الأحدث</option>
        <option value="asc">السعر: الأقل أولاً</option>
        <option value="desc">السعر: الأعلى أولاً</option>
      </select>
      <input id="maxPrice" type="number" min="0" inputmode="numeric" placeholder="أعلى سعر">
      <label class="check"><input type="checkbox" id="onlyStock"> المتوفر فقط</label>
      <label class="check"><input type="checkbox" id="onlyDeal"> عليه خصم</label>
      <label class="check" id="mineLbl" hidden><input type="checkbox" id="onlyMine"> المتوافق مع هاتفي</label>
      <button class="link" id="reset">مسح الفلاتر</button>
    </div>

    <button class="link" id="favShare" hidden>أرسل مفضلتي عبر واتساب</button>
    <div class="grid" id="grid"></div>
    <button class="btn ghost more" id="more" hidden>عرض المزيد</button>
    <div class="empty" id="empty" hidden>
      <p id="emptyMsg">لا توجد منتجات تطابق بحثك.</p>
      <button class="btn" id="reset2">مسح الفلاتر وعرض كل المنتجات</button>
    </div>
    <section id="recent" hidden><h2>شاهدتها مؤخراً</h2><div class="grid" id="recentGrid"></div></section>
  </main>
</div>

<footer id="siteFoot"></footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/category.js"></script>
</body>
</html>
